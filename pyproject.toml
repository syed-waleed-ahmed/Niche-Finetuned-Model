[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-assistant"
version = "2.0.0"
description = "Fine-tuned small language model specialized in FastAPI, served as a scalable, OpenAI-compatible HTTP service."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Syed Waleed Ahmed" }]
keywords = ["fastapi", "llm", "lora", "peft", "gguf", "llama-cpp", "rag", "fine-tuning", "inference", "mlops"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core: the HTTP service, config, metrics, auth, and Hub access. Model backends,
# persistence, and retrieval are extras so each image installs only what it runs.
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
  "huggingface_hub>=0.25.0",
  "prometheus-client>=0.20.0",
  "numpy>=1.26.0",
]

[project.optional-dependencies]
# transformers + LoRA backend (GPU serving, merge/export).
torch = [
  "torch>=2.2.0",
  "transformers>=4.45.0",
  "peft>=0.12.0",
  "accelerate>=0.33.0",
  "sentencepiece>=0.2.0",
  "protobuf>=4.25.0",
]
train = ["fastapi-assistant[torch]", "datasets>=2.20.0"]
# Quantized GGUF backend (production CPU serving).
llamacpp = ["llama-cpp-python>=0.3.0"]
postgres = ["psycopg[binary]>=3.2.0", "psycopg-pool>=3.2.0"]
rag = ["fastembed>=0.4.0"]
sentry = ["sentry-sdk[fastapi]>=2.0.0"]
datagen = ["anthropic>=2.8.0"]
# Everything the production CPU image needs.
serve = ["fastapi-assistant[llamacpp,postgres,rag,sentry]"]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
]

[project.scripts]
fastapi-assistant = "fastapi_assistant.__main__:main"

[project.urls]
Homepage = "https://github.com/syed-waleed-ahmed/Niche-Finetuned-Model"
Repository = "https://github.com/syed-waleed-ahmed/Niche-Finetuned-Model"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fastapi_assistant = ["storage/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "postgres: needs a Postgres+pgvector database at TEST_DATABASE_URL",
  "slow: downloads a real model; run with -m slow",
]

[tool.coverage.run]
source = ["fastapi_assistant"]
omit = [
  "src/fastapi_assistant/engines/transformers_engine.py",
  "src/fastapi_assistant/engines/llamacpp_engine.py",
  "src/fastapi_assistant/training.py",
  "src/fastapi_assistant/export.py",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# B008: FastAPI intentionally calls Depends()/Header()/Query() in argument defaults.
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
