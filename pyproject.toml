[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-assistant"
version = "1.0.0"
description = "Production-oriented, LoRA fine-tuned TinyLlama assistant specialized in FastAPI, served over HTTP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Syed Waleed Ahmed" }]
keywords = ["fastapi", "llm", "lora", "peft", "tinyllama", "fine-tuning", "inference", "mlops"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "torch>=2.0.0",
  "transformers>=4.40.0",
  "datasets>=2.18.0",
  "peft>=0.10.0",
  "accelerate>=0.29.0",
  "python-dotenv>=1.0.0",
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.29.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.0",
  "sentencepiece>=0.2.0",
  "protobuf>=4.25.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=4.1.0",
  "httpx>=0.27.0",
  "ruff>=0.4.0",
]

[project.scripts]
fastapi-assistant = "fastapi_assistant.__main__:main"

[project.urls]
Homepage = "https://github.com/syed-waleed-ahmed/Niche-Finetuned-Model"
Repository = "https://github.com/syed-waleed-ahmed/Niche-Finetuned-Model"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# B008: FastAPI intentionally calls Depends()/Header()/Query() in argument defaults.
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
