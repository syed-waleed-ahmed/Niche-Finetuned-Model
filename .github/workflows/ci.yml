name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU-only torch keeps CI fast)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,train,postgres]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Validate dataset (schema, code, duplicates, train/eval leakage)
        run: fastapi-assistant data validate
      - name: Test
        run: pytest --cov --cov-report=term-missing:skip-covered

  postgres:
    name: Postgres + pgvector integration
    runs-on: ubuntu-24.04
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,train,postgres]"
      - run: pytest -m postgres -rs
      - name: Migrations via the CLI
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          fastapi-assistant db migrate
          fastapi-assistant keys create ci-smoke | tail -1 | grep -q '^fa_'

  worker:
    name: Cloudflare Worker
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: deploy/cloudflare-worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: deploy/cloudflare-worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Container build, smoke test, and scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: fastapi-assistant:ci
          cache-from: type=gha,scope=ci-amd64
          cache-to: type=gha,mode=max,scope=ci-amd64
      - name: Boot the image and answer a real question
        run: |
          docker run -d --name app -p 8080:8080 -e API_KEY=ci fastapi-assistant:ci
          for i in $(seq 1 60); do
            if curl -fsS localhost:8080/ready >/dev/null 2>&1; then break; fi
            sleep 5
          done
          curl -fsS localhost:8080/ready
          curl -fsS -X POST localhost:8080/generate -H 'X-API-Key: ci' -H 'Content-Type: application/json' \
            -d '{"question":"How do I declare a path parameter?","max_new_tokens":48,"use_retrieval":true}' | tee answer.json
          python3 -c "import json; b=json.load(open('answer.json')); assert b['answer'] and b['sources'], b"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/generate -d '{}')" = 401
      - name: Container logs
        if: always()
        run: docker logs app 2>&1 | tail -50
      - name: Vulnerability scan (fail on fixable critical CVEs)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fastapi-assistant:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
