name: Release

# On every push to main: build a multi-arch image (native amd64 and arm64 runners),
# publish it to GHCR, scan it, then deploy whatever is configured:
#   * Cloud Run      when the GCP_* repository variables exist
#   * the Worker     when CLOUDFLARE_ACCOUNT_ID exists
#   * an edge smoke  when EDGE_URL exists
# Each deploy step is skipped (not failed) until its platform is set up, so the
# pipeline is safe to run from day one. See docs/DEPLOYMENT.md.

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "graphify-out/**", "eval/**", "tests/load/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { arch: amd64, platform: linux/amd64, runner: ubuntu-24.04 }
          - { arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}
      - run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    name: Publish multi-arch manifest
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: vars
        run: |
          tag="sha-${GITHUB_SHA::12}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:${{ steps.vars.outputs.tag }}" -t "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:${{ steps.vars.outputs.tag }}"

  scan:
    name: Scan image
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.publish.outputs.image }}:${{ needs.publish.outputs.tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
          # The baked RAG index is FastAPI documentation text (no packages); its
          # security tutorial contains an example JWT that the secret scanner flags.
          skip-dirs: /models/rag_index
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
      - name: Block on fixable high and critical CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.publish.outputs.image }}:${{ needs.publish.outputs.tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-dirs: /models/rag_index
          skip-setup-trivy: true

  deploy-cloudrun:
    name: Deploy Cloud Run
    needs: [publish, scan]
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
      packages: read
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      MAX_INSTANCES: ${{ vars.CLOUD_RUN_MAX_INSTANCES || '2' }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install --quiet -e .
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy the amd64 image into Artifact Registry
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          src="${{ needs.publish.outputs.image }}:${{ needs.publish.outputs.tag }}"
          amd64=$(docker buildx imagetools inspect "$src" --format '{{json .Manifest}}' \
            | jq -r '.manifests[] | select(.platform.os=="linux" and .platform.architecture=="amd64") | .digest')
          dst="$REGION-docker.pkg.dev/$PROJECT_ID/fastapi-assistant/app:${{ needs.publish.outputs.tag }}"
          docker buildx imagetools create -t "$dst" "${src%%:*}@$amd64"
          echo "IMAGE=$dst" >> "$GITHUB_ENV"
      - name: Sync secrets into Secret Manager
        # GitHub's encrypted secrets (set by scripts/setup_secrets.sh) are the source
        # of truth; Cloud Run reads them from Secret Manager. A version is added only
        # when the value changed, so the free tier's 6 active versions are not used up.
        env:
          ORIGIN_SHARED_SECRET: ${{ secrets.ORIGIN_SHARED_SECRET }}
          API_KEY: ${{ secrets.API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          sync() {
            local name=$1 value=$2
            if [ -z "$value" ]; then
              echo "::error::GitHub secret for $name is missing; run scripts/setup_secrets.sh"
              return 1
            fi
            gcloud secrets describe "$name" >/dev/null 2>&1 ||
              gcloud secrets create "$name" --replication-policy automatic >/dev/null
            current=$(gcloud secrets versions access latest --secret "$name" 2>/dev/null || true)
            if [ "$current" != "$value" ]; then
              printf '%s' "$value" | gcloud secrets versions add "$name" --data-file=- >/dev/null
              echo "$name: new version"
            else
              echo "$name: unchanged"
            fi
          }
          sync origin-shared-secret "$ORIGIN_SHARED_SECRET"
          sync api-key "$API_KEY"
          sync metrics-token "$METRICS_TOKEN"
          # Optional: a "disabled" placeholder keeps the service spec valid, and the
          # app treats it as unset (no Postgres / no Sentry).
          sync database-url "${DATABASE_URL:-disabled}"
          sync sentry-dsn "${SENTRY_DSN:-disabled}"
      - name: Render service.yaml from model-release.json
        run: |
          fastapi-assistant export env model-release.json >> "$GITHUB_ENV"
          set -a; eval "$(fastapi-assistant export env model-release.json)"; set +a
          echo "MODEL_VERSION_LABEL=$(echo "$MODEL_VERSION" | tr 'A-Z.' 'a-z-' | tr -cd 'a-z0-9_-' | cut -c1-63)" >> "$GITHUB_ENV"
      - name: Fill template
        run: |
          export LLAMACPP_CHAT_FORMAT="${LLAMACPP_CHAT_FORMAT:-}"
          export GGUF_SHA256="${GGUF_SHA256:-}"
          # Public demo: the repository variable PUBLIC_DEMO=true opens the API to callers
          # without a key at the origin and (below) at the edge; anything else keeps keys
          # required.
          export PUBLIC_DEMO="${{ vars.PUBLIC_DEMO == 'true' && 'true' || 'false' }}"
          envsubst '${IMAGE} ${PROJECT_ID} ${REGION} ${MAX_INSTANCES} ${MODEL_VERSION} ${MODEL_VERSION_LABEL} ${BASE_MODEL_NAME} ${GGUF_REPO_ID} ${GGUF_FILENAME} ${GGUF_REVISION} ${GGUF_SHA256} ${FINETUNED_WEIGHTS} ${LLAMACPP_CHAT_FORMAT} ${PUBLIC_DEMO}' \
            < deploy/cloudrun/service.yaml > service.rendered.yaml
          cat service.rendered.yaml
      - id: deploy
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3
        with:
          metadata: service.rendered.yaml
          region: ${{ env.REGION }}
      - name: Allow public invocation (the origin secret still blocks direct use)
        run: |
          gcloud run services add-iam-policy-binding fastapi-assistant --region "$REGION" \
            --member allUsers --role roles/run.invoker --quiet >/dev/null
      - name: Smoke test the origin
        run: |
          url="${{ steps.deploy.outputs.url }}"
          curl -fsS --retry 10 --retry-delay 10 --retry-all-errors "$url/health"
          curl -fsS --retry 30 --retry-delay 10 --retry-all-errors "$url/ready"

  deploy-edge:
    name: Deploy Cloudflare Worker
    needs: [publish, scan, deploy-cloudrun]
    if: ${{ !failure() && !cancelled() && vars.CLOUDFLARE_ACCOUNT_ID != '' }}
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            deploy/cloudflare-worker/package-lock.json
            web/package-lock.json
      - run: npm ci
        working-directory: deploy/cloudflare-worker
      # The Worker serves web/dist as static assets (wrangler.toml [assets]).
      - run: npm ci && npm run build
        working-directory: web
      - id: model
        run: echo "version=$(jq -r .model_version model-release.json)" >> "$GITHUB_OUTPUT"
      # Upload only the Worker secrets that exist: Upstash is optional, and the action
      # fails on a listed secret with no value.
      - id: edge-secrets
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          {
            echo "names<<EOF"
            echo ORIGIN_SHARED_SECRET
            if [ -n "$UPSTASH_REDIS_REST_URL" ] && [ -n "$UPSTASH_REDIS_REST_TOKEN" ]; then
              echo UPSTASH_REDIS_REST_URL
              echo UPSTASH_REDIS_REST_TOKEN
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: deploy/cloudflare-worker
          # MODEL_VERSION namespaces the answer cache, so a new model never serves
          # answers cached from the previous one.
          command: >-
            deploy
            --var MODEL_VERSION:${{ steps.model.outputs.version }}
            --var ORIGINS:${{ vars.EDGE_ORIGINS }}
            --var REQUIRE_API_KEY:${{ vars.PUBLIC_DEMO == 'true' && 'false' || 'true' }}
          secrets: ${{ steps.edge-secrets.outputs.names }}
        env:
          ORIGIN_SHARED_SECRET: ${{ secrets.ORIGIN_SHARED_SECRET }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

  smoke-edge:
    name: Edge smoke test (k6)
    needs: deploy-edge
    if: ${{ !failure() && !cancelled() && vars.EDGE_URL != '' && needs.deploy-edge.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece # v1.3.0
        with:
          k6-version: "1.8.2"
      - run: k6 run -e SCENARIO=smoke -e BASE_URL="${{ vars.EDGE_URL }}" -e API_KEY="${{ secrets.SMOKE_API_KEY }}" tests/load/k6.js
