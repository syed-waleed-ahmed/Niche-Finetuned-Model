version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    # pyproject.toml holds minimum versions (a library-style range), not pins.
    # Raising a floor only when the current one no longer allows the latest release
    # keeps GPU images' preinstalled CUDA torch usable (see pyproject.toml).
    versioning-strategy: increase-if-necessary
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /deploy/cloudflare-worker
    schedule: { interval: weekly }
    groups:
      worker-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/, /deploy/hf-space]
    schedule: { interval: weekly }

  - package-ecosystem: docker-compose
    directories: [/, /deploy/vm]
    schedule: { interval: weekly }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
