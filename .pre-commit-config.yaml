# Git hooks run by pre-commit (https://pre-commit.com). Set up once per clone:
#
#   pip install pre-commit
#   pre-commit install
#
# Run every hook against the whole tree with `pre-commit run --all-files`.
#
# The ruff hooks cover the same paths as CI (`ruff check src tests examples` and
# `ruff format --check src tests examples`). The whitespace fixers skip files that
# must never be rewritten by a hook: the datasets, the committed eval baselines
# (generated by `fastapi-assistant eval`), and the generated graphify-out/ outputs.
minimum_pre_commit_version: "3.2.0"

# Build output and installed packages (both git-ignored; listed for safety).
exclude: ^(web/dist/|(.*/)?node_modules/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        # Model weights, adapters and RAG indexes belong on the Hugging Face Hub or in
        # outputs/ (git-ignored), never in git. The largest tracked file is about 320 KB.
        args: [--maxkb=1024]
      - id: end-of-file-fixer
        exclude: ^(data/.*\.jsonl|eval/.*|graphify-out/.*)$
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^(data/.*\.jsonl|eval/.*|graphify-out/.*)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        files: ^(src|tests|examples)/
        types_or: [python, pyi]
      - id: ruff-format
        files: ^(src|tests|examples)/
        types_or: [python, pyi]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # Scans the staged changes. CI also runs gitleaks over the full history.
      - id: gitleaks
